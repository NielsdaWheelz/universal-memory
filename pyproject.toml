[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "universal-memory"
version = "0.1.0"
description = "An append-only PostgreSQL archive and bounded chronological memory"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "llm-tools @ git+https://github.com/NielsdaWheelz/llm-tools.git@5a37102bc73c1af0c23e63c5b70df320661f63ed",
  "pgvector==0.4.1",
  "psycopg[binary]>=3.2.9,<4",
  "pydantic==2.12.5",
  "rfc8785==0.1.4",
  "sqlalchemy[asyncio]>=2.0.43,<2.1",
]

[dependency-groups]
dev = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "pyright==1.1.405",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/universal_memory"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
